<div class="settings-page">
  <div class="page-header">
    <div>
      <h1>Trading Settings</h1>
      <p>Settings map to the API <code>TradingConfiguration</code>. Values returned by the API are loaded into the matching UI field and written back on save.</p>
    </div>
    <div class="actions">
      <button type="button" class="secondary-button" (click)="downloadJson()" [disabled]="loading || saving">Download JSON</button>
      <button type="button" class="secondary-button" (click)="reset()" [disabled]="loading || saving">Reset</button>
      <button type="button" class="primary-button" (click)="save()" [disabled]="loading || saving || form.invalid">
        {{ saving ? 'Saving…' : 'Save' }}
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">Loading configuration…</div>

  <form [formGroup]="form" *ngIf="!loading">
    <div class="settings-toolbar">
      <label class="search-field">
        <span>Search settings</span>
        <input type="search" [value]="searchTerm" (input)="updateSearch($event)" placeholder="Search by setting or section">
      </label>
    </div>

    <section class="settings-card" *ngIf="sectionMatches('trading', 'auto trading', 'paper trading', 'notifications')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('trading')" [attr.aria-expanded]="openSection === 'trading'"><span><h2>Trading</h2><p>The auto-trading flag is retained for configuration compatibility; order placement is endpoint-only. Paper, paper-as-live and notification flags are active.</p></span><span class="accordion-icon">{{ openSection === 'trading' ? '−' : '+' }}</span></button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'trading'">
        <label class="toggle-field"><input type="checkbox" formControlName="enableAutoTrading"><span>Auto trading</span></label>
        <label class="toggle-field"><input type="checkbox" formControlName="paperTrading"><span>Paper trading</span></label>
        <label class="toggle-field"><input type="checkbox" formControlName="paperTradingAsLive"><span>Paper trading as live</span></label>
        <label class="toggle-field"><input type="checkbox" formControlName="enableNotification"><span>Notifications enabled</span></label>
        <label class="toggle-field"><input type="checkbox" formControlName="enableNetProfitOpportunityNotifications"><span>Net-profit opportunity notifications</span></label>
        <label class="toggle-field"><input type="checkbox" formControlName="enablePullbackOpportunityNotifications"><span>Pullback buy-opportunity notifications</span></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('capital', 'trade allocation', 'paper trading balance')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('risk')" [attr.aria-expanded]="openSection === 'risk'"><span><h2>Capital &amp; Paper Balance</h2><p>Per-trade capital allocation and simulated account balance.</p></span><span class="accordion-icon">{{ openSection === 'risk' ? '−' : '+' }}</span></button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'risk'">
        <label><span>Maximum capital per trade %</span><input type="number" formControlName="maxCapitalPerTradePercent" min="0" max="100" step="0.1"></label>
        <label><span>Paper trading balance</span><input type="number" formControlName="paperTradingBalance" min="0" step="100"></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('equity execution', 'exchange', 'product type', 'order type', 'duration')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('equity')" [attr.aria-expanded]="openSection === 'equity'"><span><h2>Equity Execution</h2><p>Maps field-for-field to <code>TradingConfiguration.Equity</code>.</p></span><span class="accordion-icon">{{ openSection === 'equity' ? '−' : '+' }}</span></button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'equity'">
        <label><span>Exchange</span><input type="text" formControlName="exchange"></label>
        <label><span>Product type</span><input type="text" formControlName="productType"></label>
        <label><span>Order type</span><input type="text" formControlName="orderType"></label>
        <label><span>Duration</span><input type="text" formControlName="duration"></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('market hours', 'market open', 'market close', 'cutoff')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('hours')" [attr.aria-expanded]="openSection === 'hours'"><span><h2>Market Hours</h2><p>All values are sent to the API as <code>TimeSpan</code> strings.</p></span><span class="accordion-icon">{{ openSection === 'hours' ? '−' : '+' }}</span></button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'hours'">
        <label class="toggle-field"><input type="checkbox" formControlName="ignoreMarketHours"><span>Ignore market hours</span></label>
        <label><span>Market open</span><input type="time" step="1" formControlName="marketOpenTime"></label>
        <label><span>Market close</span><input type="time" step="1" formControlName="marketCloseTime"></label>
        <label><span>Intraday entry cutoff</span><input type="time" step="1" formControlName="intradayEntryCutoffTime"></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('discovery', 'watch-list', 'refresh')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('discovery')" [attr.aria-expanded]="openSection === 'discovery'"><span><h2>Watch-list</h2><p>Watch-list refresh interval.</p></span><span class="accordion-icon">{{ openSection === 'discovery' ? '−' : '+' }}</span></button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'discovery'">
        <label><span>Default page size</span><input type="number" formControlName="gainersPageSize" min="1" max="100" step="1"></label>
        <label><span>Minimum buy price change %</span><input type="number" formControlName="minimumBuyProfitChangePercent" min="0.01" max="100" step="0.01"></label>
        <label><span>Watch-list refresh minutes</span><input type="number" formControlName="watchListRefreshMinutes" min="1"></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('runtime', 'connectivity', 'consent', 'websocket', 'broker', 'retry', 'trading interval')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('runtime')" [attr.aria-expanded]="openSection === 'runtime'"><span><h2>Runtime &amp; Connectivity</h2><p>Cash-order consent and websocket connectivity controls.</p></span><span class="accordion-icon">{{ openSection === 'runtime' ? '−' : '+' }}</span></button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'runtime'">
        <label class="toggle-field"><input type="checkbox" formControlName="enableScripConsentForCashOrders"><span>Scrip consent for cash orders</span></label>
        <label><span>Websocket heartbeat seconds</span><input type="number" formControlName="webSocketHeartbeatSeconds" min="0"></label>
        <label><span>Websocket pong timeout seconds</span><input type="number" formControlName="webSocketPongTimeoutSeconds" min="0"></label>
        <label><span>Websocket retry initial seconds</span><input type="number" formControlName="webSocketRetryInitialSeconds" min="0"></label>
        <label><span>Websocket retry max seconds</span><input type="number" formControlName="webSocketRetryMaxSeconds" min="0"></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('raw market data', 'storage', 'zip', 'rollover', 'recording')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('rawMarketData')" [attr.aria-expanded]="openSection === 'rawMarketData'"><span><h2>Raw Market Data</h2><p>Market data recording and archive rollover settings.</p></span><span class="accordion-icon">{{ openSection === 'rawMarketData' ? '−' : '+' }}</span></button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'rawMarketData'">
        <label class="toggle-field"><input type="checkbox" formControlName="rawMarketDataEnabled"><span>Recording enabled</span></label>
        <label><span>Storage path</span><input type="text" formControlName="rawMarketDataStoragePath"></label>
        <label><span>Maximum ZIP size MB</span><input type="number" formControlName="rawMarketDataMaximumZipSizeMb" min="0"></label>
        <label><span>Rollover at %</span><input type="number" formControlName="rawMarketDataRollOverAtPercent" min="0" max="100"></label>

      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('operational metadata', 'daily summary', 'instrument', 'holidays', 'visible columns')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('metadata')" [attr.aria-expanded]="openSection === 'metadata'"><span><h2>Operational Metadata</h2><p>These API fields are shown so the UI stays synchronized. They are not generated or recalculated by the UI.</p></span><span class="accordion-icon">{{ openSection === 'metadata' ? '−' : '+' }}</span></button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'metadata'">
        <label><span>Last daily summary sent</span><input type="date" formControlName="lastDailySummarySent"></label>
        <label><span>Instrument loaded at</span><input type="text" formControlName="instrumentLoadedAt" readonly></label>
        <label class="wide-field"><span>Trading holidays (comma separated YYYY-MM-DD)</span><input type="text" formControlName="tradingHolidays"></label>
        <label class="wide-field"><span>Visible columns (comma separated; Stock is always visible)</span><input type="text" formControlName="visibleColumns"></label>
      </div>
    </section>
  </form>
</div>
