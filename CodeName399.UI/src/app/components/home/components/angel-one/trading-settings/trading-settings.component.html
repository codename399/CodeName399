<div class="settings-page">
  <div class="page-header">
    <div>
      <h1>Trading Settings</h1>
      <p>Settings below map to the current API TradingConfiguration model.</p>
    </div>
    <div class="actions">
      <button class="secondary-button" type="button" (click)="reset()" [disabled]="loading || saving">Reload</button>
      <button class="secondary-button" type="button" (click)="downloadJson()" [disabled]="loading">Export JSON</button>
      <button class="primary-button" type="button" (click)="save()" [disabled]="loading || saving || form.pristine">
        {{ saving ? 'Saving…' : 'Save Settings' }}
      </button>
    </div>
  </div>

  <div class="loading-state" *ngIf="loading">Loading trading configuration…</div>

  <form [formGroup]="form" *ngIf="!loading">
    <section class="settings-card" *ngIf="sectionMatches('trading', 'execution', 'notification', 'paper balance', 'square off')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('trading')" [attr.aria-expanded]="openSection === 'trading'">
          <span><h2>Trading &amp; Execution</h2><p>Auto trading, notifications and square-off controls.</p></span>
          <span class="accordion-icon">{{ openSection === 'trading' ? '−' : '+' }}</span>
        </button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'trading'">
        <label class="toggle-field"><input type="checkbox" formControlName="enableAutoTrading"><span>Enable auto trading</span></label>
        <label class="toggle-field"><input type="checkbox" formControlName="enableNotification"><span>Enable notifications</span></label>
        <label class="toggle-field"><input type="checkbox" formControlName="autoSquareOff"><span>Enable automatic square-off</span></label>
        <label><span>Paper trading balance</span><input type="number" formControlName="paperTradingBalance" min="0" step="0.01"></label>
        <label><span>Auto square-off minutes before close</span><input type="number" formControlName="autoSquareOffMinutes" min="0"></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('market', 'hours', 'timezone', 'holidays', 'cutoff')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('market')" [attr.aria-expanded]="openSection === 'market'">
          <span><h2>Market Schedule</h2><p>Exchange schedule and configured trading holidays.</p></span>
          <span class="accordion-icon">{{ openSection === 'market' ? '−' : '+' }}</span>
        </button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'market'">
        <label><span>Market open (IST)</span><input type="time" formControlName="marketOpenTime"></label>
        <label><span>Market close (IST)</span><input type="time" formControlName="marketCloseTime"></label>
        <label><span>Intraday entry cutoff (calculated by API)</span><input type="text" [value]="intradayCutoffTime" readonly></label>
        <label><span>Market time zone ID</span><input type="text" formControlName="marketTimeZoneId"></label>
        <label class="wide-field"><span>Trading holidays (comma separated YYYY-MM-DD)</span><input type="text" formControlName="tradingHolidays"></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('scanner', 'candidates', 'candles', 'batch', 'excluded symbols', 'charge cover')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('scanner')" [attr.aria-expanded]="openSection === 'scanner'">
          <span><h2>Market Scan &amp; Candle Processing</h2><p>Candidate count, candle interval, batching and charge-cover lookback.</p></span>
          <span class="accordion-icon">{{ openSection === 'scanner' ? '−' : '+' }}</span>
        </button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'scanner'">
        <label><span>Maximum candidates</span><input type="number" formControlName="maxCandidates" min="1"></label>
        <label><span>Candle interval</span>
          <select formControlName="candleInterval">
            <option value="ONE_MINUTE">1 minute</option>
            <option value="THREE_MINUTE">3 minutes</option>
            <option value="FIVE_MINUTE">5 minutes</option>
            <option value="FIFTEEN_MINUTE">15 minutes</option>
            <option value="THIRTY_MINUTE">30 minutes</option>
          </select>
        </label>
        <label><span>Candle batch size</span><input type="number" formControlName="candleBatchSize" min="1"></label>
        <label><span>Delay between batches (seconds)</span><input type="number" formControlName="batchDelay" min="0"></label>
        <label><span>Buy batch size</span><input type="number" formControlName="buyBatchSize" min="1"></label>
        <label><span>Lowest price-change lookback candles</span><input type="number" formControlName="chargeCoverLowestPriceChangeCandles" min="1"></label>
        <label class="wide-field"><span>Excluded symbols (comma separated)</span><input type="text" formControlName="excludedSymbols"></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('websocket', 'heartbeat', 'pong', 'retry', 'connectivity')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('websocket')" [attr.aria-expanded]="openSection === 'websocket'">
          <span><h2>WebSocket Connectivity</h2><p>Heartbeat, pong timeout and reconnect backoff.</p></span>
          <span class="accordion-icon">{{ openSection === 'websocket' ? '−' : '+' }}</span>
        </button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'websocket'">
        <label><span>Heartbeat seconds</span><input type="number" formControlName="webSocketHeartbeatSeconds" min="1"></label>
        <label><span>Pong timeout seconds</span><input type="number" formControlName="webSocketPongTimeoutSeconds" min="2"></label>
        <label><span>Initial retry seconds</span><input type="number" formControlName="webSocketRetryInitialSeconds" min="1"></label>
        <label><span>Maximum retry seconds</span><input type="number" formControlName="webSocketRetryMaxSeconds" min="1"></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('display', 'columns', 'research', 'metadata')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('display')" [attr.aria-expanded]="openSection === 'display'">
          <span><h2>Display &amp; Research</h2><p>Visible dashboard columns and research data version.</p></span>
          <span class="accordion-icon">{{ openSection === 'display' ? '−' : '+' }}</span>
        </button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'display'">
        <label class="wide-field"><span>Visible columns (comma separated)</span><input type="text" formControlName="visibleColumns"></label>
        <label><span>Research data version</span><input type="text" formControlName="researchDataVersion"></label>
        <label><span>Last daily summary sent</span><input type="text" formControlName="lastDailySummarySent" readonly></label>
        <label><span>Instrument loaded at</span><input type="text" formControlName="instrumentLoadedAt" readonly></label>
      </div>
    </section>

    <section class="settings-card" *ngIf="sectionMatches('raw market data', 'storage', 'zip', 'rollover', 'recording')">
      <div class="card-header">
        <button type="button" class="accordion-trigger" (click)="toggleSection('raw')" [attr.aria-expanded]="openSection === 'raw'">
          <span><h2>Raw Market Data</h2><p>Recording and archive rollover settings.</p></span>
          <span class="accordion-icon">{{ openSection === 'raw' ? '−' : '+' }}</span>
        </button>
      </div>
      <div class="grid-4" *ngIf="openSection === 'raw'">
        <label class="toggle-field"><input type="checkbox" formControlName="rawMarketDataEnabled"><span>Recording enabled</span></label>
        <label><span>Storage path</span><input type="text" formControlName="rawMarketDataStoragePath"></label>
        <label><span>Maximum ZIP size MB</span><input type="number" formControlName="rawMarketDataMaximumZipSizeMb" min="1"></label>
        <label><span>Rollover at %</span><input type="number" formControlName="rawMarketDataRollOverAtPercent" min="1" max="100"></label>
        <label class="toggle-field"><input type="checkbox" formControlName="rawMarketDataRecordOnlyDuringMarketHours"><span>Record only during market hours</span></label>
      </div>
    </section>
  </form>
</div>
