<div class="settings-page">
  <div class="page-header">
    <div>
      <h1>Core Trading Settings</h1>
      <p>Only the production trading rules used by the Core strategy are configurable here.</p>
    </div>
    <div class="actions">
      <button type="button" class="secondary-button" (click)="reset()" [disabled]="loading || saving">Reset</button>
      <button type="button" class="primary-button" (click)="save()" [disabled]="loading || saving || form.invalid">{{ saving ? 'Saving…' : 'Save' }}</button>
    </div>
  </div>

  <div *ngIf="loading" class="loading-state">Loading configuration…</div>

  <form [formGroup]="form" *ngIf="!loading">
    <section class="settings-card">
      <div class="card-header"><h2>Core Entry Rules</h2><p>These are the only entry conditions.</p></div>
      <div class="grid-4">
<label class="toggle-field"><input type="checkbox" formControlName="allowLong"><span>Allow long equity entries</span></label>
        <label class="toggle-field"><input type="checkbox" formControlName="paperTrading"><span>Paper trading</span></label>
        <label class="toggle-field"><input type="checkbox" formControlName="enableAutoTrading"><span>Auto trading</span></label>
        <label class="toggle-field"><input type="checkbox" formControlName="enableNotification"><span>Trade emails</span></label>
      </div>
    </section>

    <section class="settings-card">
      <div class="card-header"><h2>Market Hours</h2></div>
      <div class="grid-4">
        <label class="toggle-field"><input type="checkbox" formControlName="ignoreMarketHours"><span>Ignore market hours</span></label>
        <label><span>Market open</span><input type="time" formControlName="marketOpenTime"></label>
        <label><span>Market close</span><input type="time" formControlName="marketCloseTime"></label>
        <label class="toggle-field"><input type="checkbox" formControlName="autoSquareOff"><span>Auto square-off</span></label>
      </div>
    </section>
  </form>
</div>
