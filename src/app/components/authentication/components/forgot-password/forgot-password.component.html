<div class="auth-page">
  <div class="auth-card">
    <h1>Forgot password</h1>
    <p>Reset your CodeName399 password using an OTP.</p>

    <label>Verification method</label>

    <div class="channel-buttons">
      <button type="button" [class.active]="channel === 'Email'" (click)="channel = 'Email'">Email</button>
      <button type="button" [class.active]="channel === 'Contact'" (click)="channel = 'Contact'">Mobile</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="step === 'request' ? requestOtp() : resetPassword()">
      <label>Username / Email / Mobile</label>
      <input formControlName="identifier" autocomplete="username" />

      @if (step === 'reset') {
        <label>OTP</label>
        <input formControlName="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />

        <label>New password</label>
        <input type="password" formControlName="newPassword" autocomplete="new-password" />

        <label>Confirm password</label>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />

        <button type="submit" [disabled]="loading">{{ loading ? 'Resetting...' : 'Reset password' }}</button>
      } @else {
        <button type="submit" [disabled]="loading || form.controls.identifier.invalid">{{ loading ? 'Sending...' : 'Send OTP' }}</button>
      }
    </form>

    <button class="link-button" type="button" (click)="backToLogin()">Back to login</button>
  </div>
</div>
